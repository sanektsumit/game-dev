<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

  <meta name="twitter:title" content="⚡ Wah Kya Energy Hai! · GAIL Clean Energy Challenge" />

  <meta name="twitter:image" content="https://gail-connect-d9e21.web.app/campaign_banner.png?v=2" />
  <!-- Apple iOS / Safari Compatibility Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wah Kya Energy" />
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
  <link rel="apple-touch-icon" href="gail_logo.png" />
  <style>
    :root {
      --g: #22c55e;
      --lime: #a3e635;
      --y: #facc15;
      --gold: #fbbf24;
      --bg: #050d0a;
      --t: #f0fdf4;
      /* iOS Safe Area Insets (Notch, Dynamic Island, Home Bar) */
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html {
      height: 100%;
      height: -webkit-fill-available;
    }

    body {
      margin: 0;
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, Roboto, sans-serif;
      color: var(--t);
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .phone {
      max-width: 430px;
      height: 100%;
      height: 100vh;
      height: -webkit-fill-available;
      height: 100dvh;
      margin: 0 auto;
      position: relative;
      background: radial-gradient(ellipse at 50% 20%, #14532d 0%, var(--bg) 55%);
      overflow: hidden;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }

    /* IG story progress bars - notch & Dynamic Island safe */
    .bars {
      display: flex;
      gap: 3px;
      padding: calc(var(--sat) + 8px) 10px 0;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
    }

    .bars i {
      flex: 1;
      height: 3px;
      background: #ffffff33;
      border-radius: 99px;
      overflow: hidden;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }

    .bars i b {
      display: block;
      height: 100%;
      width: 0;
      background: #fff;
      border-radius: 99px;
    }

    .bars i.done b {
      width: 100%;
    }

    .bars i.active b {
      animation: fill linear forwards;
      -webkit-animation: fill linear forwards;
    }

    @keyframes fill {
      from { width: 0; }
      to { width: 100%; }
    }

    @-webkit-keyframes fill {
      from { width: 0; }
      to { width: 100%; }
    }

    /* Top bar - notch & Dynamic Island safe */
    .top {
      position: absolute;
      top: calc(var(--sat) + 18px);
      left: max(12px, var(--sal));
      right: max(12px, var(--sar));
      z-index: 21;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 42px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--y), var(--g));
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #052e16;
      font-size: 14px;
      border: 2px solid #fff;
      flex-shrink: 0;
    }

    .who {
      flex: 1;
    }

    .who strong {
      display: block;
      font-size: 13px;
    }

    .who span {
      font-size: 11px;
      opacity: .75;
    }

    .gail-logo-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .gail-logo-badge img {
      height: 30px;
      width: auto;
      max-width: 50px;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45));
      transition: transform .2s ease;
      display: block;
      -webkit-user-drag: none;
    }

    .gail-logo-badge img:hover,
    .gail-logo-badge img:active {
      transform: scale(1.06);
    }

    /* Slides with safe areas top & bottom */
    .slide {
      position: absolute;
      inset: 0;
      padding: calc(var(--sat) + 68px) 16px calc(var(--sab) + 16px);
      display: none;
      flex-direction: column;
      justify-content: flex-end;
      gap: 10px;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .slide.on {
      display: flex;
      animation: pop .28s ease;
      -webkit-animation: pop .28s ease;
    }

    @keyframes pop {
      from { opacity: .4; transform: scale(1.02); }
      to { opacity: 1; transform: none; }
    }

    @-webkit-keyframes pop {
      from { opacity: .4; -webkit-transform: scale(1.02); }
      to { opacity: 1; -webkit-transform: none; }
    }

    .emoji {
      font-size: 48px;
      filter: drop-shadow(0 8px 20px #22c55e66);
    }

    .kicker {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      color: var(--lime);
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.15;
      text-shadow: 0 2px 16px #000a;
    }

    .sub {
      margin: 0;
      color: #bbf7d0;
      font-size: 14px;
      line-height: 1.35;
    }

    /* Centered Start Page */
    .slide.intro-slide {
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: calc(var(--sat) + 64px) 16px calc(var(--sab) + 16px);
      gap: 10px;
    }

    .intro-top-meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .intro-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: auto 0;
      gap: 12px;
    }

    .intro-logo-card {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 380px;
      padding: 4px;
      filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 20px rgba(34, 197, 94, 0.3));
      animation: floatLogo 3.5s ease-in-out infinite alternate;
      -webkit-animation: floatLogo 3.5s ease-in-out infinite alternate;
    }

    @keyframes floatLogo {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px) scale(1.015); }
    }

    @-webkit-keyframes floatLogo {
      0% { -webkit-transform: translateY(0px) scale(1); }
      100% { -webkit-transform: translateY(-6px) scale(1.015); }
    }

    .intro-logo {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      -webkit-user-drag: none;
    }

    /* Tree Contest Announcement Banner */
    .contest-banner {
      background: linear-gradient(135deg, rgba(20, 83, 45, 0.85), rgba(6, 78, 59, 0.9));
      border: 1.5px solid #4ade80;
      border-radius: 16px;
      padding: 10px 12px;
      text-align: center;
      width: 100%;
      max-width: 390px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(34, 197, 94, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .contest-banner:active { transform: scale(0.98); }

    .contest-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #22c55e;
      color: #052e16;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 999px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .contest-text {
      font-size: 12.5px;
      line-height: 1.35;
      color: #ecfdf5;
      font-weight: 600;
    }

    .contest-text strong {
      color: var(--y);
      font-weight: 800;
    }

    .contest-sublink {
      font-size: 11px;
      color: var(--lime);
      margin-top: 3px;
      font-weight: 700;
      text-decoration: underline;
    }

    .intro-bottom {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* HUD for Questions Only (Never shown on Result) */
    .hud {
      position: absolute;
      top: calc(var(--sat) + 64px);
      right: max(14px, var(--sar));
      z-index: 22;
      background: #000a;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid #ffffff22;
      border-radius: 14px;
      padding: 6px 10px;
      text-align: right;
      min-width: 90px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .hud b {
      display: block;
      font-size: 19px;
      color: var(--y);
      line-height: 1.1;
    }

    .hud small {
      opacity: .8;
      font-size: 10px;
      display: block;
    }

    .hud .hud-time {
      color: var(--lime);
      font-weight: 700;
      font-size: 11px;
      margin-top: 2px;
    }

    /* Choices */
    .choice {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 15px 14px;
      background: #14532d88;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      text-align: left;
      border: 1.5px solid #22c55e99;
      display: flex;
      gap: 10px;
      align-items: center;
      touch-action: manipulation;
      -webkit-appearance: none;
      cursor: pointer;
      transition: background 0.28s ease, border-color 0.28s ease, transform 0.2s ease, box-shadow 0.28s ease;
    }

    .choice:active { transform: scale(.98); -webkit-transform: scale(.98); }

    .choice .pts {
      margin-left: auto;
      color: var(--y);
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      transform: translateX(4px);
      transition: opacity 0.25s ease, transform 0.25s ease, color 0.25s ease;
    }

    .choice.revealed .pts { opacity: 1; transform: translateX(0); }
    .choice.good { border-color: #22c55e99; background: #14532d88; }
    .choice.bad { border-color: #ef444499; background: #450a0a99; }
    .choice.selected { box-shadow: 0 0 0 2px #fff, 0 0 16px rgba(255, 255, 255, 0.45); }

    .toast {
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%) scale(.9);
      -webkit-transform: translate(-50%, -50%) scale(.9);
      background: #052e16ee;
      border: 2px solid var(--g);
      color: var(--lime);
      padding: 16px 20px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 17px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 40;
      text-align: center;
      max-width: 88%;
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }

    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); -webkit-transform: translate(-50%, -50%) scale(1); }
    .toast.bad { background: #450a0aee; border-color: #ef4444; color: #fecaca; }

    .cta {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--g), #16a34a);
      color: #052e16;
      font-weight: 800;
      font-size: 16px;
      touch-action: manipulation;
      -webkit-appearance: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .cta:active { transform: scale(.98); -webkit-transform: scale(.98); }

    .ghost {
      width: 100%;
      border: 1.5px solid #ffffff44;
      border-radius: 16px;
      padding: 13px;
      background: transparent;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      touch-action: manipulation;
      -webkit-appearance: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .ghost:active { transform: scale(.98); -webkit-transform: scale(.98); }

    /* =========================================
       REFINED PROFESSIONAL RESULT SCREEN STYLES
       ========================================= */
    .slide.result-slide {
      justify-content: flex-start;
      padding: calc(var(--sat) + 68px) 14px calc(var(--sab) + 16px);
      gap: 10px;
    }

    .sharebox {
      background: linear-gradient(180deg, rgba(20, 83, 45, 0.55) 0%, rgba(5, 46, 22, 0.78) 100%);
      border: 1.5px solid rgba(74, 222, 128, 0.4);
      border-radius: 20px;
      padding: 14px 12px;
      text-align: center;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      position: relative;
    }

    .sharebox-header {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--lime);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .sharebox .big {
      font-size: 56px;
      font-weight: 900;
      color: var(--y);
      line-height: 1;
      text-shadow: 0 0 24px rgba(250, 204, 21, 0.45);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin: 2px 0;
    }

    .sharebox .level-title {
      font-size: 15.5px;
      color: #86efac;
      font-weight: 800;
      letter-spacing: 0.03em;
      margin-bottom: 8px;
    }

    /* Unified Sleek Stats Strip */
    .unified-stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: rgba(4, 29, 16, 0.75);
      border: 1px solid rgba(34, 197, 94, 0.35);
      border-radius: 12px;
      padding: 6px 8px;
      margin-bottom: 8px;
    }

    .unified-stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .unified-stat-val {
      font-size: 13.5px;
      font-weight: 800;
      color: #f0fdf4;
    }

    .unified-stat-label {
      font-size: 9px;
      color: var(--lime);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 1px;
    }

    .unified-stat-sep {
      width: 1px;
      height: 22px;
      background: rgba(255, 255, 255, 0.15);
    }

    /* Compact Badges */
    .badges-compact {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
      margin: 6px 0;
    }

    .badge-pill {
      background: rgba(5, 46, 22, 0.85);
      border: 1px solid rgba(34, 197, 94, 0.4);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 10.5px;
      font-weight: 600;
      color: #dcfce7;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .sharebox-logo {
      margin-top: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .sharebox-logo img {
      height: 26px;
      width: auto;
      max-width: 75%;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
    }

    /* Compact Leaderboard Submit Card */
    .lb-compact-card {
      background: rgba(15, 23, 42, 0.68);
      border: 1px solid rgba(34, 197, 94, 0.4);
      border-radius: 15px;
      padding: 9px 12px;
      text-align: center;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    .lb-compact-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .lb-compact-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--y);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .lb-compact-tree-tag {
      font-size: 9.5px;
      background: #22c55e;
      color: #052e16;
      padding: 2px 6px;
      border-radius: 999px;
      font-weight: 800;
    }

    .lb-compact-row {
      display: flex;
      gap: 6px;
    }

    .lb-compact-input {
      flex: 1;
      background: rgba(4, 29, 16, 0.75);
      border: 1px solid rgba(34, 197, 94, 0.5);
      border-radius: 10px;
      padding: 8px 10px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      outline: none;
      -webkit-user-select: auto;
      user-select: auto;
      min-width: 0;
    }

    .lb-compact-input::placeholder {
      color: rgba(134, 239, 172, 0.6);
    }

    .lb-compact-btn {
      background: linear-gradient(135deg, var(--g), #16a34a);
      color: #052e16;
      border: 0;
      border-radius: 10px;
      padding: 8px 13px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .lb-compact-btn:active { transform: scale(0.97); }

    /* Action Buttons Grid */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 8px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s ease, opacity 0.15s ease;
      border: 0;
      -webkit-appearance: none;
    }

    .action-btn:active { transform: scale(0.97); }

    .action-btn-hero {
      grid-column: span 2;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      padding: 13px;
      box-shadow: 0 4px 18px rgba(37, 211, 102, 0.35);
    }

    .action-btn-secondary {
      background: rgba(30, 41, 59, 0.7);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .action-btn-secondary:hover, .action-btn-secondary:active {
      background: rgba(51, 65, 85, 0.85);
      border-color: rgba(255, 255, 255, 0.45);
    }

    .action-btn-lb {
      background: rgba(20, 83, 45, 0.6);
      border: 1.5px solid rgba(250, 204, 21, 0.4);
      color: var(--y);
    }

    .replay-link-btn {
      background: transparent;
      border: 0;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12.5px;
      font-weight: 700;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      margin: 0 auto;
    }

    .replay-link-btn:active { color: #fff; transform: scale(0.97); }

    /* Leaderboard Modal */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      z-index: 50;
      display: none;
      flex-direction: column;
      padding: calc(var(--sat) + 20px) 16px calc(var(--sab) + 16px);
      animation: fadeIn .2s ease;
    }

    .modal-backdrop.open { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #ffffff22;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--y);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-close {
      background: #ffffff22;
      border: 0;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .lb-contest-note {

</head>

    </div>
    <div class="hud" id="hud" style="display:none">

    <!-- Leaderboard Modal -->
    <div class="modal-backdrop" id="leaderboardModal">

      <div style="margin-top:10px;">
        <button class="cta" onclick="closeLeaderboard()">CLOSE LEADERBOARD</button>
      </div>
    </div>
  </div>

  <!-- Hidden canvas for generating high-res downloadable scorecards -->
  <canvas id="scorecardCanvas" width="760" height="550" style="display:none;"></canvas>

  <script>
    // SCENES: Every single tab in every scenario has UNIQUE marks.
    // Scenario 8 updated from "Dirtier fuel" to "Diesel / Petrol".
    const SCENES = [
      {
        type: 'intro',

        cta: 'START CHALLENGE ▶'
      },
      {
        type: 'q',
        emoji: '🚗',
        kicker: 'SCENARIO 1 · COMMUTE',
        title: "You're going to work.",
        sub: 'Pick your move (Time & Choice matter)',
        choices: [
          { t: 'Public transport', p: 12, clean: true, tags: ['commute'] },
          { t: 'Carpool', p: 8, clean: true, tags: ['commute'] },
          { t: 'Drive alone', p: -6, clean: false },
        ]
      },
      {
        type: 'q',
        emoji: '🔥',
        kicker: 'SCENARIO 2 · KITCHEN',
        title: 'Dinner time. Cooking fuel?',
        sub: 'This or that energy',
        choices: [
          { t: 'PNG', p: 12, clean: true, tags: ['cook'] },

      },
      {

      },
      {

      },
      {
        type: 'q',
        emoji: '☀️',
        kicker: 'SCENARIO 4 · POWER',
        title: 'Society power upgrade.',
        sub: 'What do you support?',
        choices: [
          { t: 'Solar / wind', p: 16, clean: true, tags: ['sun'] },
          { t: 'Waste-to-energy', p: 11, clean: true, tags: ['waste'] },
          { t: 'More coal', p: -14, clean: false },
        ]
      },
      {
        type: 'q',
        emoji: '🛍️',
        kicker: 'SCENARIO 5 · SHOP',
        title: 'Shopping haul.',
        sub: 'What goes in the bag?',
        choices: [
          { t: 'Sustainable picks', p: 11, clean: true, tags: ['voice'] },
          { t: 'Fast fashion', p: -8, clean: false },
        ]
      },
      {
        type: 'q',
        emoji: '🌳',
        kicker: 'SCENARIO 6 · WEEKEND',
        title: 'Neighbourhood weekend.',
        sub: 'One green move',
        choices: [
          { t: 'Walk / cycle', p: 14, clean: true, tags: ['commute'] },
          { t: 'Plant a tree', p: 10, clean: true, tags: ['tree'] },
          { t: 'Litter', p: -9, clean: false },
        ]
      },
      {
        type: 'q',
        emoji: '💡',
        kicker: 'SCENARIO 7 · HOME',
        title: 'Leaving home.',
        sub: 'Lights & AC?',
        choices: [
          { t: 'Switch OFF', p: 8, clean: true, tags: ['saver'] },
          { t: 'Leave ON', p: -6, clean: false },
        ]
      },
      {
        type: 'q',
        emoji: '🚘',
        kicker: 'SCENARIO 8 · TRIP',
        title: 'Weekend out of town.',
        sub: 'Fuel choice',
        choices: [
          { t: 'CNG', p: 13, clean: true, tags: ['commute'] },
          { t: 'Carpool friends', p: 9, clean: true, tags: ['commute'] },
          { t: 'Diesel / Petrol', p: -11, clean: false },
        ]
      },
      {
        type: 'q',
        emoji: '📢',
        kicker: 'SCENARIO 9 · VOICE',
        title: 'Friend asks about clean energy.',
        sub: 'Your move',
        choices: [
          { t: 'Challenge them to play!', p: 11, clean: true, tags: ['voice'] },
          { t: 'Spread the message', p: 7, clean: true, tags: ['voice'] },
          { t: 'Ignore', p: -6, clean: false },
        ]
      },
      {
        type: 'q',
        emoji: '🗑️',
        kicker: 'SCENARIO 10 · WASTE',
        title: 'Festival leftovers.',
        sub: 'How do you handle waste?',
        choices: [
          { t: 'Segregate + WTE', p: 14, clean: true, tags: ['waste'] },
          { t: 'Burn garbage', p: -13, clean: false },
        ]
      },
      { type: 'result' }
    ];

    const LEVELS = [
      { min: 0, n: '🌫️ Energy Explorer' },
      { min: 40, n: '🌱 Green Starter' },
      { min: 80, n: '⚡ Energy Pro' },
      { min: 120, n: '🌿 Clean Energy Champion' },
      { min: 155, n: '🏆 WAH KYA ENERGY MASTER' }
    ];

    // Seeded leaderboard to ensure dynamic competition immediately
    const DEFAULT_LEADERBOARD = [
      { name: 'Aarav Sharma', city: 'New Delhi', score: 184, time: 31, date: 'Today' },
      { name: 'Priya Kulkarni', city: 'Noida', score: 177, time: 34, date: 'Today' },
      { name: 'Vikram Mehta', city: 'Mumbai', score: 169, time: 38, date: 'Yesterday' },
      { name: 'Ananya Roy', city: 'Bengaluru', score: 162, time: 35, date: 'Yesterday' },
      { name: 'Rohan Gupta', city: 'GAIL Pata', score: 156, time: 41, date: '2d ago' },
      { name: 'Deepak Verma', city: 'GAIL Vijaipur', score: 149, time: 43, date: '3d ago' },
      { name: 'Kavita Iyer', city: 'Chennai', score: 144, time: 46, date: '3d ago' },
      { name: 'Sneha Patel', city: 'Ahmedabad', score: 138, time: 44, date: '4d ago' }
    ];

    function getLeaderboard() {
      try {
        const saved = localStorage.getItem('gail_wah_kya_lb_v2');
        if (saved) return JSON.parse(saved);
      } catch (e) { }
      return DEFAULT_LEADERBOARD;
    }

    function saveLeaderboard(lb) {
      try {
        localStorage.setItem('gail_wah_kya_lb_v2', JSON.stringify(lb));
      } catch (e) { }
    }

    let i = 0, score = 0, streak = 0, maxStreak = 0, tags = {}, timer = null;
    let gameStartTime = null, gameEndTime = null, qStartTime = null;
    let totalTimeSec = 0, totalSpeedBonus = 0;
    let hudTimerInterval = null;
    let isSubmitted = false;

    function level() {
      let c = LEVELS[0];
      for (const l of LEVELS) if (score >= l.min) c = l;
      return c;
    }

    function bars() {
      const el = document.getElementById('bars');
      el.innerHTML = '';
      SCENES.forEach((_, idx) => {
        const x = document.createElement('i');
        if (idx < i) x.className = 'done';
        if (idx === i) x.className = 'active';
        x.innerHTML = '<b></b>';
        el.appendChild(x);
      });
      const active = el.querySelector('i.active b');
      if (active) {
        active.style.animationDuration = SCENES[i].type === 'q' ? '12s' : '6s';
      }
    }

    function toast(msg, bad = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (bad ? ' bad' : '');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.remove('show'), 1400);
    }

    function startHudTimer() {
      if (hudTimerInterval) clearInterval(hudTimerInterval);
      hudTimerInterval = setInterval(() => {
        if (!gameStartTime || gameEndTime) return;
        const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
        const timeEl = document.getElementById('hudTime');
        if (timeEl) timeEl.textContent = `⏱️ ${elapsed}s`;
      }, 500);
    }

    function stopHudTimer() {
      if (hudTimerInterval) {
        clearInterval(hudTimerInterval);
        hudTimerInterval = null;
      }
    }

    function render() {
      bars();
      const s = SCENES[i];
      const stage = document.getElementById('stage');
      const hud = document.getElementById('hud');

      // CRITICAL FIX: HUD is ONLY shown during questions, NEVER on result slide!
      hud.style.display = (s.type === 'q' || s.type === 'lucky') ? 'block' : 'none';
      document.getElementById('score').textContent = score;
      document.getElementById('streakLab').textContent = 'streak ' + streak;

      if (s.type === 'intro') {
        stage.innerHTML = `<div class="slide on intro-slide">
          <div class="intro-top-meta">
            <div class="emoji">${s.emoji}</div>
            <div class="kicker">${s.kicker}</div>
          </div>
          <div class="intro-center">
            <div class="intro-logo-card">
              <img src="logo_3d_clean_transparent.png" alt="#WahKyaENERGYHai" class="intro-logo" />
            </div>
            <div class="contest-banner" onclick="openLeaderboard()">
              <div class="contest-badge">🌱 CONTEST ALERT</div>
              <div class="contest-text">
                <strong>Every 10 days, top 5 unique individuals</strong> on the Leaderboard will win <strong>Geotagged Trees</strong> planted on their name!
              </div>
              <div class="contest-sublink">Tap to view Leaderboard 🏆</div>
            </div>
            <p class="sub">${s.sub.replace(/\n/g, '<br>')}</p>
          </div>
          <div class="intro-bottom">
            <button class="cta" onclick="startGame()">${s.cta}</button>
            <button class="ghost" onclick="openLeaderboard()">🏆 VIEW LIVE LEADERBOARD</button>
          </div>
        </div>`;
        return;
      }

      if (s.type === 'lucky') {
        stage.innerHTML = `<div class="slide on">
          <div class="emoji">${s.emoji}</div>
          <div class="kicker">${s.kicker}</div>
          <h1>${s.title}</h1>
          <p class="sub">${s.sub}</p>
          <button class="cta" onclick="claimLucky(${s.bonus})">CLAIM +${s.bonus} ⚡</button>
        </div>`;
        return;
      }

      if (s.type === 'result') {
        stopHudTimer();
        if (!gameEndTime) {
          gameEndTime = Date.now();
          totalTimeSec = Math.max(1, Math.round((gameEndTime - gameStartTime) / 1000));
        }

        const b = [];
        if (tags.commute) b.push('🚗 Clean Commuter');
        if (tags.cook) b.push('🔥 Clean Cook');
        if (tags.sun) b.push('☀️ Sun Power');
        if (tags.waste) b.push('♻️ Waste Warrior');
        if (tags.saver) b.push('💡 Energy Saver');
        if (tags.voice) b.push('📢 Green Voice');
        if (tags.tree) b.push('🌳 Green Thumb');
        if (maxStreak >= 5 || score >= 90) b.push('⚡ Wah Kya Energy!');

        stage.innerHTML = `<div class="slide on result-slide">
          <!-- Main Hero Scorecard -->
          <div class="sharebox">
            <div class="sharebox-header">⚡ YOUR ENERGY SCORECARD</div>
            <div class="big">${score} ⚡</div>
            <div class="level-title">${level().n}</div>

            <!-- Unified Single-Row Stats Bar -->
            <div class="unified-stats-bar">
              <div class="unified-stat-item">
                <span class="unified-stat-val">⏱️ ${totalTimeSec}s</span>
                <span class="unified-stat-label">Total Time</span>
              </div>
              <div class="unified-stat-sep"></div>
              <div class="unified-stat-item">
                <span class="unified-stat-val">⚡ +${totalSpeedBonus}</span>
                <span class="unified-stat-label">Speed Bonus</span>
              </div>
              <div class="unified-stat-sep"></div>
              <div class="unified-stat-item">
                <span class="unified-stat-val">🔥 ${maxStreak}</span>
                <span class="unified-stat-label">Streak</span>
              </div>
            </div>

            <!-- Badges -->
            <div class="badges-compact">
              ${b.map(x => `<span class="badge-pill">${x}</span>`).join('') || '<span class="badge-pill">🌱 Clean Starter</span>'}
            </div>

            <div class="sharebox-logo">
              <img src="logo_3d_clean_transparent.png" alt="Wah Kya Energy Hai" />
            </div>
          </div>

          <!-- Professional Action Grid -->
          <div class="action-grid">
            <button class="action-btn action-btn-hero" onclick="shareOnWhatsApp()">
              💬 SHARE ON WHATSAPP (+ IMAGE)
            </button>
            <button class="action-btn action-btn-secondary" onclick="downloadScorecard()">
              📥 DOWNLOAD PNG
            </button>
            <button class="action-btn action-btn-lb" onclick="openLeaderboard()">
              🏆 LEADERBOARD
            </button>
          </div>

          <!-- Sleek Compact Leaderboard Claim -->
          <div class="lb-compact-card" id="lbSubmitBox">
            <div class="lb-compact-header">
              <div class="lb-compact-title">🏆 Claim Leaderboard Rank</div>
              <span class="lb-compact-tree-tag">🌱 Win Geotagged Tree</span>
            </div>
            ${isSubmitted ? `
              <div style="padding:4px;color:#a3e635;font-weight:800;font-size:12.5px;">
                ✅ Your score has been submitted to the Leaderboard!
              </div>
            ` : `
              <div class="lb-compact-row">
                <input type="text" class="lb-compact-input" id="playerName" placeholder="Your Name" maxlength="20" />
                <input type="text" class="lb-compact-input" id="playerCity" placeholder="City" maxlength="20" />
                <button class="lb-compact-btn" onclick="submitScore()">SUBMIT 🚀</button>
              </div>
            `}
          </div>

          <!-- Subtle Play Again Link -->
          <button class="replay-link-btn" onclick="restart()">
            🔄 Play Again
          </button>
        </div>`;
        return;
      }

      // Question slide
      qStartTime = Date.now();
      stage.innerHTML = `<div class="slide on">
        <div class="emoji">${s.emoji}</div>
        <div class="kicker">${s.kicker}</div>
        <h1>${s.title}</h1>
        <p class="sub">${s.sub}</p>
        ${s.choices.map((c, idx) => `<button class="choice good" id="choice-${idx}" onclick="pick(${idx})"><span id="choice-icon-${idx}">🌱</span><span>${c.t}</span></button>`).join('')}
      </div>`;
    }

    function startGame() {
      gameStartTime = Date.now();
      gameEndTime = null;
      totalSpeedBonus = 0;
      isSubmitted = false;
      startHudTimer();
      i++;
      render();
    }

    let isPicking = false;

    function pick(idx) {
      if (isPicking) return;
      isPicking = true;

      const choices = SCENES[i].choices;
      const c = choices[idx];
      const qDurationSec = (Date.now() - qStartTime) / 1000;

      // REVEAL: only after selection, all with - marks turn red!
      choices.forEach((choice, cIdx) => {
        const btn = document.getElementById(`choice-${cIdx}`);
        const icon = document.getElementById(`choice-icon-${cIdx}`);
        if (!btn) return;
        btn.style.pointerEvents = 'none';

        if (choice.p < 0 || !choice.clean) {
          btn.className = 'choice bad revealed';
          if (icon) icon.textContent = '🔴';
        } else {
          btn.className = 'choice good revealed';
          if (icon) icon.textContent = '🌱';
        }

        if (cIdx === idx) {
          btn.classList.add('selected');
        }
      });

      score += c.p;
      (c.tags || []).forEach(t => tags[t] = (tags[t] || 0) + 1);

      if (c.clean) {
        streak++;
        maxStreak = Math.max(maxStreak, streak);

        // Speed bonus calculation based on reaction time
        let speedBonus = 0;
        if (qDurationSec < 3.0) {
          speedBonus = 5;
        } else if (qDurationSec < 5.0) {
          speedBonus = 3;
        } else if (qDurationSec < 8.0) {
          speedBonus = 1;
        }

        if (speedBonus > 0) {
          score += speedBonus;
          totalSpeedBonus += speedBonus;
        }

        let streakBonus = 0, msg = `⚡ +${c.p} ENERGY!`;
        if (speedBonus > 0) msg += ` + ⏱️+${speedBonus} Speed!`;
        if (streak === 3) { streakBonus = 10; msg += ' 🌱 STREAK +10'; }
        if (streak === 5) { streakBonus = 20; msg += ' ⚡ BOOST +20'; }
        if (streak === 8) { streakBonus = 30; msg += ' 🔥 MASTER +30'; }
        score += streakBonus;
        toast(msg);
      } else {
        streak = 0;
        toast(`${c.p} · streak broken`, true);
      }

      setTimeout(() => {
        isPicking = false;
        i++;
        render();
      }, 900);
    }

    function claimLucky(n) {
      score += n;
      toast(`⚡ +${n} BONUS!`);
      setTimeout(() => { i++; render(); }, 600);
    }

    function restart() {
      isPicking = false;
      i = 0;
      score = 0;
      streak = 0;
      maxStreak = 0;
      tags = {};
      gameStartTime = null;
      gameEndTime = null;
      totalSpeedBonus = 0;
      totalTimeSec = 0;
      isSubmitted = false;
      stopHudTimer();
      render();
    }

    // Leaderboard management
    function openLeaderboard() {
      const modal = document.getElementById('leaderboardModal');
      const listEl = document.getElementById('leaderboardList');
      const lb = getLeaderboard();

      // Sort by score DESC, then time ASC (faster time wins tiebreaker)
      lb.sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        return (a.time || 999) - (b.time || 999);
      });

      listEl.innerHTML = lb.map((item, idx) => {
        const rank = idx + 1;
        const isTop5 = rank <= 5;
        let rankBadge = `#${rank}`;
        if (rank === 1) rankBadge = '🥇';
        else if (rank === 2) rankBadge = '🥈';
        else if (rank === 3) rankBadge = '🥉';
        else if (isTop5) rankBadge = '🌳';

        return `<div class="lb-item ${isTop5 ? 'top-five' : ''}">
          <div class="lb-rank">${rankBadge}</div>
          <div class="lb-info">
            <div class="lb-name">${escapeHtml(item.name)} <span style="font-size:11px;opacity:0.75;">· ${escapeHtml(item.city || 'India')}</span></div>
            <div class="lb-meta">
              ${isTop5 ? '<span class="lb-tree-badge">🌱 Wins Geotagged Tree</span>' : ''}
              <span>${item.date || 'Recent'}</span>
            </div>
          </div>
          <div class="lb-score-col">
            <div class="lb-score">${item.score} ⚡</div>
            <div class="lb-time">⏱️ ${item.time || 45}s</div>
          </div>
        </div>`;
      }).join('');

      modal.classList.add('open');
    }

    function closeLeaderboard() {
      document.getElementById('leaderboardModal').classList.remove('open');
    }

    function submitScore() {
      const nameInput = document.getElementById('playerName');
      const cityInput = document.getElementById('playerCity');
      const name = (nameInput ? nameInput.value.trim() : '') || 'Clean Champion';
      const city = (cityInput ? cityInput.value.trim() : '') || 'India';

      const lb = getLeaderboard();
      const newEntry = {
        name: name,
        city: city,
        score: score,
        time: totalTimeSec,
        date: 'Just now'
      };

      lb.push(newEntry);
      lb.sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        return (a.time || 999) - (b.time || 999);
      });

      saveLeaderboard(lb);
      isSubmitted = true;

      const userRank = lb.findIndex(x => x === newEntry) + 1;
      if (userRank <= 5) {
        toast(`🎉 Rank #${userRank}! You're in Top 5 for a Geotagged Tree! 🌳`);
      } else {
        toast(`Submitted! Your Rank is #${userRank} ⚡`);
      }

      render();
      setTimeout(openLeaderboard, 600);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function loadImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
        if (img.complete) resolve(img);
      });
    }

    // High-Resolution Canvas Scorecard Generator - Exact Match to Card ("As It Is")
    function generateScorecardCanvas(callback) {
      const canvas = document.getElementById('scorecardCanvas');
      const ctx = canvas.getContext('2d');
      const W = 760;
      const H = 550;
      canvas.width = W;
      canvas.height = H;

      // 1. Card Background Gradient
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#031c0e');
      grad.addColorStop(0.35, '#063519');
      grad.addColorStop(0.7, '#042412');
      grad.addColorStop(1, '#021208');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Radial Glow behind the score
      const radGrad = ctx.createRadialGradient(W / 2, 135, 10, W / 2, 135, 260);
      radGrad.addColorStop(0, 'rgba(34, 197, 94, 0.45)');
      radGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = radGrad;
      ctx.fillRect(0, 0, W, H);

      // Sleek Glowing Card Border (Matching the User Screenshot)
      ctx.strokeStyle = '#4ade8099';
      ctx.lineWidth = 3;
      roundRect(ctx, 12, 12, W - 24, H - 24, 28, false, true);

      // Pre-load pipe logo
      loadImage('logo_3d_clean_transparent.png').then((pipeLogoImg) => {
        // 1. Header: ⚡ YOUR ENERGY SCORECARD
        ctx.textAlign = 'center';
        ctx.fillStyle = '#a3e635';
        ctx.font = '800 15px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
        ctx.fillText('⚡ YOUR ENERGY SCORECARD', W / 2, 54);

        // 2. Score: Big Glowing Yellow with Lightning
        ctx.fillStyle = '#facc15';
        ctx.font = '900 88px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
        ctx.shadowColor = 'rgba(250, 204, 21, 0.65)';
        ctx.shadowBlur = 26;
        ctx.fillText(`${score} ⚡`, W / 2, 146);
        ctx.shadowBlur = 0; // reset shadow

        // 3. Level Title
        const lvlText = typeof level === 'function' ? level().n : '🏆 WAH KYA ENERGY MASTER';
        ctx.fillStyle = '#86efac';
        ctx.font = 'bold 24px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
        ctx.fillText(lvlText, W / 2, 192);

        // 4. Unified Stats Bar (Exact Match to Screenshot)
        const barW = 680, barH = 64;
        const barX = (W - barW) / 2;
        const barY = 222;

        ctx.fillStyle = 'rgba(4, 29, 16, 0.85)';
        ctx.strokeStyle = 'rgba(34, 197, 94, 0.45)';
        ctx.lineWidth = 1.5;
        roundRect(ctx, barX, barY, barW, barH, 14, true, true);

        // Vertical Separators
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(barX + barW / 3, barY + 12);
        ctx.lineTo(barX + barW / 3, barY + barH - 12);
        ctx.moveTo(barX + (barW / 3) * 2, barY + 12);
        ctx.lineTo(barX + (barW / 3) * 2, barY + barH - 12);
        ctx.stroke();

        // Stat Items
        const colW = barW / 3;
        const stats = [
          { val: `⏱️ ${totalTimeSec}s`, label: 'TOTAL TIME' },
          { val: `⚡ +${totalSpeedBonus}`, label: 'SPEED BONUS' },
          { val: `🔥 ${maxStreak}`, label: 'STREAK' }
        ];

        stats.forEach((st, idx) => {
          const cx = barX + idx * colW + colW / 2;
          ctx.fillStyle = '#f0fdf4';
          ctx.font = '800 20px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
          ctx.fillText(st.val, cx, barY + 30);

          ctx.fillStyle = '#a3e635';
          ctx.font = '800 11px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
          ctx.fillText(st.label, cx, barY + 49);
        });

        // 5. Badges Layout (Matching the 3 rows in screenshot)
        let badgeList = [];
        if (typeof tags !== 'undefined') {
          if (tags.commute) badgeList.push('🚗 Clean Commuter');
          if (tags.cook) badgeList.push('🔥 Clean Cook');
          if (tags.sun) badgeList.push('☀️ Sun Power');
          if (tags.waste) badgeList.push('♻️ Waste Warrior');
          if (tags.saver) badgeList.push('💡 Energy Saver');
          if (tags.voice) badgeList.push('📢 Green Voice');
          if (tags.tree) badgeList.push('🌳 Green Thumb');
          if (maxStreak >= 5 || score >= 90) badgeList.push('⚡ Wah Kya Energy!');
        }
        if (!badgeList.length) {
          badgeList = [
            '🚗 Clean Commuter', '🔥 Clean Cook', '☀️ Sun Power',
            '♻️ Waste Warrior', '💡 Energy Saver', '📢 Green Voice',
            '⚡ Wah Kya Energy!'
          ];
        }

        const r1 = badgeList.slice(0, 3);
        const r2 = badgeList.slice(3, 6);
        const r3 = badgeList.slice(6);

        function drawRow(row, yPos) {
          if (!row || !row.length) return;
          const bW = 200, bH = 36, bGap = 12;
          const startX = (W - (row.length * bW + (row.length - 1) * bGap)) / 2;
          row.forEach((text, bIdx) => {
            const bx = startX + bIdx * (bW + bGap);
            ctx.fillStyle = 'rgba(5, 46, 22, 0.9)';
            ctx.strokeStyle = 'rgba(34, 197, 94, 0.45)';
            ctx.lineWidth = 1.5;
            roundRect(ctx, bx, yPos, bW, bH, 18, true, true);

            ctx.fillStyle = '#dcfce7';
            ctx.font = 'bold 14px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
            ctx.fillText(text, bx + bW / 2, yPos + 23);
          });
        }

        drawRow(r1, 308);
        drawRow(r2, 354);
        drawRow(r3, 400);

        // 6. Centered #WahKyaENERGYHai 3D Pipe Logo
        if (pipeLogoImg) {
          const logoW = 230;
          const logoAspect = pipeLogoImg.naturalHeight / (pipeLogoImg.naturalWidth || 1);
          const logoH = logoW * logoAspect;
          const logoY = H - logoH - 24;
          ctx.drawImage(pipeLogoImg, (W - logoW) / 2, logoY, logoW, logoH);
        }

        if (callback) callback(canvas);
      });
    }

    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
      if (typeof radius === 'undefined') radius = 5;
      if (typeof radius === 'number') {
        radius = Math.max(0, Math.min(radius, Math.abs(width) / 2, Math.abs(height) / 2));
      }
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, radius);
        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
        return;
      }
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function downloadScorecard() {
      toast('Generating Scorecard PNG...');
      generateScorecardCanvas(function (canvas) {
        try {
          const dataUrl = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          link.download = `WahKyaEnergy_Scorecard_${score}pts.png`;
          link.href = dataUrl;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          toast('✅ Scorecard image downloaded!');
        } catch (e) {
          toast('Downloaded as image', false);
        }
      });
    }

    // Share on WhatsApp with full score text AND the score image!
    async function shareOnWhatsApp() {
      const waText = `⚡ I scored *${score} Energy Points* on GAIL *#WahKyaENERGYHai* in *${totalTimeSec}s*! 🌿\n\n` +
        `🏆 Level: ${level().n}\n` +
        `🔥 Clean Streak: ${maxStreak} in a row\n` +
        `⚡ Speed Bonus: +${totalSpeedBonus}\n\n` +
        `🌳 *CONTEST ALERT:* Every 10 days, the top 5 unique players on the Leaderboard win *Geotagged Trees* planted on their name!\n\n` +
        `Can you beat my score and win a tree? Check out my scorecard & play here 👇\n` +
        `https://gail-connect-d9e21.web.app/scorecard?score=${score}&time=${totalTimeSec}&speed=${totalSpeedBonus}&streak=${maxStreak}`;

      toast('Preparing Score Image for WhatsApp...');

      generateScorecardCanvas(async function (canvas) {
        canvas.toBlob(async function (blob) {
          let sharedDirectly = false;
          if (blob) {
            const file = new File([blob], `WahKyaEnergy_Scorecard_${score}pts.png`, { type: 'image/png' });

            // 1. Mobile Share (iOS Safari, Android Chrome): Passes actual score image + text directly into WhatsApp!
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              try {
                await navigator.share({
                  files: [file],
                  title: 'Wah Kya Energy Hai! · GAIL Clean Energy Challenge',
                  text: waText
                });
                sharedDirectly = true;
                toast('✅ Shared with Score Image!');
                return;
              } catch (err) {
                if (err && err.name === 'AbortError') return; // User cancelled
                console.log('Native file share failed, using fallback', err);
              }
            }

            // 2. Desktop fallback: Copy image to clipboard for instant Ctrl+V into WhatsApp chat!
            try {
              if (navigator.clipboard && window.ClipboardItem) {
                await navigator.clipboard.write([
                  new ClipboardItem({ 'image/png': blob })
                ]);
                toast('📋 Score image copied! Paste (Ctrl+V) in WhatsApp.');
              }
            } catch (clipErr) {
              console.log('Clipboard copy failed', clipErr);
            }
          }

          // 3. Download the score image file so user has it ready
          downloadScorecard();

          // 4. Open WhatsApp with formatted text
          const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(waText)}`;
          setTimeout(() => {
            window.open(waUrl, '_blank');
          }, 450);
        }, 'image/png');
      });
    }

    // Enable iOS Safari :active pseudo-class on touch
    document.addEventListener('touchstart', function () { }, { passive: true });

    // Check if directly navigating to scorecard / result page
    const initParams = new URLSearchParams(window.location.search);
    if (window.location.hash === '#scorecard' || window.location.hash === '#result' || initParams.has('scorecard') || initParams.has('result') || initParams.has('score')) {
      const resIdx = SCENES.findIndex(s => s.type === 'result');
      if (resIdx !== -1) {
        i = resIdx;
        score = parseInt(initParams.get('score')) || 245;
        totalTimeSec = parseInt(initParams.get('time')) || 24;
        totalSpeedBonus = parseInt(initParams.get('speed')) || 50;
        maxStreak = parseInt(initParams.get('streak')) || 10;
        tags = { commute: 1, cook: 1, sun: 1, waste: 1, saver: 1, voice: 1 };
      }
    }

    // Initial render
    render();
  </script>
